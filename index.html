<!DOCTYPE html>
<html>
<head>

<title>Cloud Vault</title>

<style>

body{
    font-family:Arial;
    max-width:1000px;
    margin:auto;
    padding:20px;
}

.file{
    border:1px solid gray;
    padding:10px;
    margin:10px 0;
}

pre{
    background:#f5f5f5;
    padding:10px;
    white-space:pre-wrap;
    overflow:auto;
}

</style>

</head>
<body>

<h2>My Cloud Vault</h2>

<div id="files"></div>

<script>

const user = "mxt104";
const repo = "vault";

const codeExt =
[
".py",".txt",".java",
".cpp",".c",".js",
".html",".css",".sql"
];

function isCode(name){

    return codeExt.some(
    ext => name.endsWith(ext)
    );
}

async function loadFiles(){

    const response =
    await fetch(

    `https://api.github.com/repos/${user}/${repo}/contents`

    );

    const files =
    await response.json();

    const div =
    document.getElementById(
    "files"
    );

    for(let file of files){

        if(file.name=="index.html")
            continue;

        let html = "";

        if(isCode(file.name)){

            const text =
            await fetch(
            file.download_url
            );

            const content =
            await text.text();

            html = `

            <pre>
${content}
            </pre>
            `;
        }

        else{

            html = `

            <a href="${file.download_url}"
               target="_blank">

            Open

            </a>

            <a href="${file.download_url}"
               download>

            Download

            </a>
            `;
        }

        div.innerHTML += `

        <div class="file">

        <h3>${file.name}</h3>

        ${html}

        </div>
        `;
    }
}

loadFiles();

</script>

</body>
</html>
