<!DOCTYPE html>
<html>

<head>

<title>Cloud Vault</title>

<style>

body{
    font-family:Arial;
    max-width:1000px;
    margin:auto;
    padding:20px;
}

.file{
    border:1px solid gray;
    padding:10px;
    margin:10px 0;
    border-radius:8px;
}

pre{
    background:#f5f5f5;
    padding:10px;
    white-space:pre-wrap;
    overflow:auto;
    max-height:400px;
}

button{
    margin-right:10px;
}

</style>

</head>

<body>

<h2>My Cloud Vault</h2>

<div id="files"></div>

<script>

const user = "mxt104";
const repo = "vault";

const codeExt =
[
    ".py",
    ".txt",
    ".java",
    ".cpp",
    ".c",
    ".js",
    ".html",
    ".css",
    ".sql",
    ".json",
    ".xml"
];

function isCode(name){

    return codeExt.some(
        ext => name.toLowerCase().endsWith(ext)
    );
}

function copyText(text){

    navigator.clipboard
    .writeText(text);

    alert("Copied!");
}

function escapeHtml(text){

    return text
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;");
}

async function downloadFile(url,name){

    const response =
    await fetch(url);

    const blob =
    await response.blob();

    const objectUrl =
    URL.createObjectURL(blob);

    const a =
    document.createElement("a");

    a.href = objectUrl;
    a.download = name;

    document.body
    .appendChild(a);

    a.click();

    a.remove();

    URL.revokeObjectURL(
        objectUrl
    );
}

async function loadFiles(){

    const response =
    await fetch(
        `https://api.github.com/repos/${user}/${repo}/contents`
    );

    const files =
    await response.json();

    const div =
    document.getElementById(
        "files"
    );

    div.innerHTML = "";

    for(let file of files){

        if(file.name=="index.html")
            continue;

        let html = "";

        if(isCode(file.name)){

            const textFile =
            await fetch(
                file.download_url
            );

            const content =
            await textFile.text();

            html = `

            <button onclick='copyText(
            ${JSON.stringify(content)}
            )'>

            Copy

            </button>

            <button onclick='downloadFile(
            "${file.download_url}",
            "${file.name}"
            )'>

            Download

            </button>

            <pre>
${escapeHtml(content)}
            </pre>

            `;
        }

        else{

            html = `

            <button onclick='downloadFile(
            "${file.download_url}",
            "${file.name}"
            )'>

            Download

            </button>

            `;
        }

        div.innerHTML += `

        <div class="file">

        <h3>${file.name}</h3>

        ${html}

        </div>

        `;
    }
}

loadFiles();

</script>

</body>

</html>
