<!DOCTYPE html>
<html>

<head>

<title>Cloud Vault</title>

<style>

body{
    font-family:Arial;
    max-width:1000px;
    margin:auto;
    padding:20px;
}

.file{
    border:1px solid gray;
    padding:10px;
    margin:10px 0;
    border-radius:8px;
}

pre{
    background:#f5f5f5;
    padding:10px;
    white-space:pre-wrap;
    overflow:auto;
    max-height:400px;
}

button{
    margin-right:10px;
    cursor:pointer;
}

</style>

</head>

<body>

<h2>My Cloud Vault</h2>

<div id="files"></div>

<script>

const user = "mxt104";
const repo = "vault";

const codeExt =
[
    ".py",".txt",".java",".cpp",".c",
    ".js",".html",".css",".sql",
    ".json",".xml",".sh"
];

function isCode(name){

    return codeExt.some(
        ext => name.toLowerCase().endsWith(ext)
    );
}

function copyText(text){

    navigator.clipboard.writeText(
        text
    );

    alert("Copied!");
}

async function downloadFile(url,name){

    const response =
    await fetch(url);

    const blob =
    await response.blob();

    const objectUrl =
    URL.createObjectURL(blob);

    const a =
    document.createElement("a");

    a.href = objectUrl;
    a.download = name;

    a.click();

    URL.revokeObjectURL(
        objectUrl
    );
}

async function loadFiles(){

    const response =
    await fetch(
        `https://api.github.com/repos/${user}/${repo}/contents`
    );

    const files =
    await response.json();

    const container =
    document.getElementById(
        "files"
    );

    container.innerHTML = "";

    for(let file of files){

        if(file.name==="index.html")
            continue;

        const fileBox =
        document.createElement(
            "div"
        );

        fileBox.className =
        "file";

        const title =
        document.createElement(
            "h3"
        );

        title.textContent =
        file.name;

        fileBox.appendChild(
            title
        );

        const downloadBtn =
        document.createElement(
            "button"
        );

        downloadBtn.textContent =
        "Download";

        downloadBtn.onclick =
        ()=>downloadFile(
            file.download_url,
            file.name
        );

        fileBox.appendChild(
            downloadBtn
        );

        if(isCode(file.name)){

            const textFile =
            await fetch(
                file.download_url
            );

            const content =
            await textFile.text();

            const copyBtn =
            document.createElement(
                "button"
            );

            copyBtn.textContent =
            "Copy";

            copyBtn.onclick =
            ()=>copyText(
                content
            );

            fileBox.appendChild(
                copyBtn
            );

            const pre =
            document.createElement(
                "pre"
            );

            // IMPORTANT:
            // textContent, not innerHTML
            pre.textContent =
            content;

            fileBox.appendChild(
                pre
            );
        }

        container.appendChild(
            fileBox
        );
    }
}

loadFiles();

</script>

</body>

</html>
